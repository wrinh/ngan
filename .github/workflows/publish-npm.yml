name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches npm/package.json version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -e "console.log(JSON.parse(require('fs').readFileSync('npm/package.json','utf8')).version)")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag version ($TAG_VER) does not match npm/package.json version ($PKG_VER)"
            exit 1
          fi

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check (all targets)
        run: moon check --target all

      - name: Test MoonBit
        run: moon test

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - working-directory: npm
        run: npm ci

      - working-directory: npm
        run: npm run build --if-present

      - working-directory: npm
        run: npm test --if-present

      - working-directory: npm
        run: npm publish --provenance --access public
